# Supabase local dev config
# https://supabase.com/docs/guides/local-development

# project_id is the LOCAL dev identifier (it names the local Docker stack). It is NOT the
# deploy target -- that comes from `supabase link` or an explicit --project-ref. It held
# "lxfgylmkexnyryafmibi" for a long time, which is a DIFFERENT project from the live one and
# does not appear anywhere else in this repo. Corrected so the repo states one ref, not two,
# and nobody copies the stale one into a real deploy command.
#
# Live project: adcbrclppmnguzkzwiys   (deploy with ./scripts/deploy-function.sh <slug>)
project_id = "adcbrclppmnguzkzwiys"

[api]
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
port = 54323

[inbucket]
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
file_size_limit = "50MiB"

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = ["https://accessyourplace.com", "https://www.accessyourplace.com"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[functions.ai-investor-chat]
verify_jwt = false

[functions.investor-auth-v2]
verify_jwt = false

[functions.investor-register]
verify_jwt = false

[functions.investor-login]
verify_jwt = false

[functions.investor-session]
verify_jwt = false

[functions.staff-login]
verify_jwt = false

[functions.staff-forgot-password]
verify_jwt = false

[functions.security-alerts]
verify_jwt = false

[functions.get-properties]
verify_jwt = false

[functions.manage-deal-marketplace]
verify_jwt = false
