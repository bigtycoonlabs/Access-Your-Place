<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staff Login - Access Your Place</title><link rel="stylesheet" href="ayp-shared.css"><style>body{min-height:100vh;display:grid;place-items:center;padding:24px}.staff{width:min(430px,100%);border:1px solid var(--hairline);border-radius:9px;padding:38px;background:var(--slate-panel)}.staff .brand{margin-bottom:34px}.staff h1{font-size:25px;margin-bottom:8px}.staff>p{color:var(--ink-dim);font-size:13px;margin-bottom:26px}.field{display:grid;gap:7px;margin-bottom:16px}.field label{font-size:12px;color:var(--ink-dim)}.field input{border:1px solid var(--hairline);background:var(--obsidian);color:var(--ink);border-radius:6px;padding:12px}.staff button{border:0;width:100%;cursor:pointer}.back{display:block;text-align:center;margin-top:20px;color:var(--ink-faint);font-size:12px}.notice{display:none;color:var(--cyan);font-size:12px;text-align:center;margin-top:14px}</style></head><body><main class="staff"><a href="index.html" class="brand"><span class="brand-mark"><svg viewBox="0 0 28 28" fill="none"><path d="M14 2L25 8V20L14 26L3 20V8L14 2Z" stroke="#F4D976" stroke-width="1.4"/><path d="M14 9L19 12V18L14 21L9 18V12L14 9Z" fill="#F4D976"/></svg></span>Access Your Place</a><div class="section-label">Authorized Team Access</div><h1>Staff sign in</h1><p>This login is reserved for Access Your Place staff, Acquisition Managers, and Setup Managers.</p><form id="staff-form"><div class="field"><label>Staff email</label><input type="email" required></div><div class="field"><label>Password</label><input type="password" required></div><button class="btn-gold">Sign In to Staff Dashboard</button><div class="notice" id="notice">Demo only. Production staff authentication remains separate.</div></form><a class="back" href="client-access.html">Not staff? Return to Client Access</a></main><script>document.getElementById('staff-form').onsubmit=e=>{e.preventDefault();document.getElementById('notice').style.display='block'}</script></body></html>
